<style>
    :host { display: inline-block; vertical-align: middle; }
    .wrapper { 
        display: flex; align-items: stretch;
        padding: 2px; height: 32px; border-radius: 2px;
        font-family: Arial, sans-serif; user-select: none;
    }
    .discount { background: #4c6b22; color: #beee11; padding: 0 6px; display: flex; align-items: center; font-size: 24px; font-weight: bold; }
    .prices { background: #344654; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding: 0 10px; min-width: 80px; }
    .old { color: #708999; text-decoration: line-through; font-size: 11px; line-height: 1; margin-bottom: 1px; }
    .now { color: #beee11; font-size: 14px; line-height: 1; }
    .btn { 
        border: none; margin-left: 2px; padding: 0 15px; 
        background: linear-gradient(to right, #8ed529 0%, #6aa621 100%); 
        color: #d2efa9; font-size: 15px; cursor: pointer; border-radius: 2px;
        white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn:active { filter: brightness(0.9); }
    .hidden { display: none !important; }
</style>

<div class="wrapper">
    <div id="discount-tag" class="discount"></div>
    <div class="prices">
        <span id="price-old" class="old"></span>
        <span id="price-now" class="now"></span>
    </div>
    <button id="add-btn" class="btn" type="button">Add to Cart</button>
</div>
