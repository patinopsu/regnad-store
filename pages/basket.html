<div id="cart-counter">Cart: 0 items</div>

<script>
    function updateHeaderCount() {
        const cart = JSON.parse(localStorage.getItem('steam_cart') || '[]');
        document.getElementById('cart-counter').textContent = `Cart: ${cart.length} items`;
    }

    // Listen for the custom event we created in basket.js
    window.addEventListener('basket-updated', () => {
        updateHeaderCount();
    });

    // Initial load
    updateHeaderCount();
</script>
