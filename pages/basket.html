<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
    <div>
        <h1>Baskets</h1>

        <div class="basket-details">
            <div class="item-count"><span id="cart-counter"></span> Items</div>
            <p class="product-list">Product List Work in Progress</p>
        </div>
    </div>

</body>
<script>
    function updateHeaderCount() {
        const cart = JSON.parse(localStorage.getItem('steam_cart') || '[]');
        document.getElementById('cart-counter').textContent = `${cart.length}`;
    }


    // Listen for the custom event we created in basket.js
    window.addEventListener('basket-updated', () => {
        updateHeaderCount();
    });


    // Initial load
    updateHeaderCount();
</script>
<style>
    [data-page="basket"] .content {
        display: flex;
        justify-content: center;
        align-items: center; /* Changed to center for better alignment with large text */
        gap: 20px;
        margin-top: 50px;
    }

    /* This container keeps the small text stacked vertically */
    .basket-details {
        display: flex;
        flex-direction: column;
        align-items: flex-start; /* Aligns text to the left within the group */
    }

    [data-page="basket"] .content h1 {
        font-size: 50px;
        margin: 0;
        line-height: 1;
    }

    [data-page="basket"] .content p {
        font-size: 18px;
        text-align: center;
        margin: 0; /* Remove default margins to control spacing better */
    }
</style>
</html>
